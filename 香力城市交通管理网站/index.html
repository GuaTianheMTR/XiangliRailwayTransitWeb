<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>香力城市交通管理网站</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <svg class="brand-logo" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="8" cy="13" r="2" fill="currentColor"/>
          <circle cx="16" cy="13" r="2" fill="currentColor"/>
          <path d="M10 13h4" stroke="currentColor" stroke-width="1.6"/>
        </svg>
        <span class="brand-title" id="siteTitle">香力城市交通管理网站</span>
      </div>
      <button class="lang-btn" id="langBtn" title="切换语言 / Switch language">EN</button>
    </div>
    <div class="mention-banner hidden" id="mentionBanner">有人@你哦</div>
  </header>

  <main id="main">
    <!-- 首页 / Home -->
    <section class="page active" id="page-home">
      <div class="page-head">
        <h1 id="homeTitle">首页</h1>
        <p class="page-sub" id="homeSub">香力城市简介与线路图</p>
      </div>
      <div id="homeAdminBar" class="admin-bar hidden"></div>
      <div class="card map-card">
        <div class="card-title" id="mapTitle">线路图 / Route Map</div>
        <div id="mapArea" class="map-area"></div>
      </div>
      <div class="card intro-card">
        <div class="card-title" id="introTitle">城市简介 / Introduction</div>
        <div id="introText" class="intro-text"></div>
      </div>
    </section>

    <!-- 公司 / Company -->
    <section class="page" id="page-company">
      <div class="page-head">
        <h1 id="companyTitle">公司</h1>
        <p class="page-sub" id="companySub">查看香力城市各运营公司</p>
      </div>
      <div id="companyAdminBar" class="admin-bar hidden"></div>
      <div id="companyList" class="list"></div>
    </section>

    <!-- 成员 / Members -->
    <section class="page" id="page-members">
      <div class="page-head">
        <h1 id="membersTitle">成员</h1>
        <p class="page-sub" id="membersSub">香力城市成员列表</p>
      </div>
      <div id="memberAdminBar" class="admin-bar hidden"></div>
      <div id="memberMe" class="me-card"></div>
      <div id="memberList" class="list"></div>
    </section>

    <!-- 线路 / Routes -->
    <section class="page" id="page-routes">
      <div class="page-head">
        <h1 id="routesTitle">线路</h1>
        <p class="page-sub" id="routesSub">按名称与类型排列</p>
      </div>
      <div id="routeAdminBar" class="admin-bar hidden"></div>
      <div id="routeList" class="list"></div>
    </section>

    <!-- 聊天 / Chat -->
    <section class="page" id="page-chat">
      <div class="page-head">
        <h1 id="chatTitle">聊天</h1>
        <p class="page-sub" id="chatSub">成员之间交流</p>
      </div>
      <div class="chat-wrap" id="chatWrap"></div>
    </section>

    <!-- 管理员 / Admin -->
    <section class="page" id="page-admin">
      <div class="page-head">
        <h1 id="adminTitle">管理员</h1>
        <p class="page-sub" id="adminSub">管理网站全部内容</p>
      </div>
      <div id="adminGate"></div>
      <div id="adminPanel" class="hidden"></div>
    </section>

    <footer class="site-footer">
      <div class="footer-links">
        <a href="http://9666.uno:31203/" target="_blank" rel="noopener" data-i18n="linkSatellite">卫星在线地图</a>
        <span class="footer-dot"></span>
        <a href="http://play.simpfun.cn:14260/" target="_blank" rel="noopener" data-i18n="linkRouteMap">线路在线地图</a>
      </div>
      <div>
        <span id="authorLabel">作者：</span>
        <a id="authorLink" href="https://space.bilibili.com/1434735329?spm_id_from=333.1007.0.0" target="_blank" rel="noopener">@呱瓜多米</a>
      </div>
    </footer>
  </main>

  <nav class="bottom-nav">
    <button class="nav-item active" data-page="home">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 9.5V20h14V9.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="nav-label" data-i18n="navHome">首页</span>
    </button>
    <button class="nav-item" data-page="company">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="8" width="16" height="12" rx="1.5" stroke="currentColor" stroke-width="1.8"/><path d="M8 20v-4h8v4M9 8V5h6v3M4 12h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span class="nav-label" data-i18n="navCompany">公司</span>
    </button>
    <button class="nav-item" data-page="members">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="9" cy="8" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 19c.5-3 2.5-5 5.5-5s5 2 5.5 5M15.5 5.5a3 3 0 0 1 0 5M17 14c2.5.4 3.8 2 4.2 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span class="nav-label" data-i18n="navMembers">成员</span>
    </button>
    <button class="nav-item" data-page="routes">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="3" width="14" height="12" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M9 15v3h6v-3M9 15l-2.5 3M15 15l2.5 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="nav-label" data-i18n="navRoutes">线路</span>
    </button>
    <button class="nav-item" data-page="chat">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-4 3v-3H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 10h8M8 13h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span class="nav-label" data-i18n="navChat">聊天</span>
      <span class="nav-badge hidden" id="chatBadge"></span>
    </button>
    <button class="nav-item" data-page="admin">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3 5 6v5c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6l-7-3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9.5 12l1.8 1.8L14.5 10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="nav-label" data-i18n="navAdmin">管理员</span>
    </button>
  </nav>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <div class="modal-head">
        <h3 id="modalTitle"></h3>
        <button class="modal-close" id="modalClose" aria-label="关闭">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="lightbox" id="lightbox">
    <img id="lightboxImg" alt="" />
  </div>

  <script src="app.js"></script>
</body>
</html>
